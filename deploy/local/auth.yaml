apiVersion: apps/v1
kind: Deployment
metadata:
  name: volund-auth
  labels:
    app: volund-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volund-auth
  template:
    metadata:
      labels:
        app: volund-auth
    spec:
      containers:
        - name: volund-auth
          image: ghcr.io/ai-volund/volund-auth
          ports:
            - containerPort: 3456
          env:
            - name: PORT
              value: "3456"
            - name: DATABASE_URL
              value: "postgres://volund:volund@postgres:5432/volund?sslmode=disable"
            - name: AUTH_BASE_URL
              value: "http://localhost:3456"
            - name: TRUSTED_ORIGINS
              value: "http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:3456"
            - name: JWT_ISSUER
              value: "volund"
            - name: BETTER_AUTH_SECRET
              value: "volund-dev-secret-change-me-in-production"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3456
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: volund-auth
spec:
  selector:
    app: volund-auth
  ports:
    - port: 3456
      targetPort: 3456
